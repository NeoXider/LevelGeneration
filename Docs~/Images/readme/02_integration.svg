<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d"><title id="t">Neoxider LevelGeneration integration points</title><desc id="d">The game plugs into the package through three points: MinimapGameplay.Context (IMinimapGameplayContext), LevelGenerationRuntimeLog sinks and LevelGenerationProjectPaths.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131a33"/></linearGradient><linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cff7a"/><stop offset="1" stop-color="#2fbf4a"/></linearGradient><linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7defff"/><stop offset="1" stop-color="#1b9fc0"/></linearGradient><linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3a8ff"/><stop offset="1" stop-color="#6c4be0"/></linearGradient><linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc27a"/><stop offset="1" stop-color="#e8661e"/></linearGradient><radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38d6e8" stop-opacity="0.35"/><stop offset="1" stop-color="#38d6e8" stop-opacity="0"/></radialGradient><radialGradient id="haloP" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a07bff" stop-opacity="0.30"/><stop offset="1" stop-color="#a07bff" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32,0 L0,0 L0,32" fill="none" stroke="#1c2547" stroke-width="1"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6cf"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ee05a"/></marker><marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38d6e8"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9548"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a07bff"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6fa8"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="0" y="0" width="1280" height="640" rx="18" fill="url(#bg)"/>
<rect x="0.75" y="0.75" width="1278.5" height="638.5" rx="17.5" fill="none" stroke="#2c3868" stroke-width="1.5"/>
<text x="40" y="48" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#eef2ff" text-anchor="start">Plugging it into your game</text>
<text x="1240" y="48" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="end">the package references no game assembly</text>
<text x="40" y="86" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#5ee05a" text-anchor="start">YOUR GAME</text>
<text x="640" y="86" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#9aa6cf" text-anchor="middle">WIRING POINT</text>
<text x="860" y="86" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#38d6e8" text-anchor="start">INSIDE THE PACKAGE</text>
<rect x="40" y="100" width="380" height="128" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<rect x="40" y="114" width="5" height="100" rx="2.5" fill="#5ee05a"/>
<text x="62" y="132" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start">Input and presence</text>
<text x="62" y="158" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#9aa6cf" font-weight="400">implements </tspan><tspan fill="#eef2ff" font-weight="400" font-family="Cascadia Code, Consolas, Menlo, monospace">IMinimapGameplayContext</tspan></text>
<text x="62" y="178" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">Presence → Exploring | Occupied</text>
<text x="62" y="198" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">WasFullMapTogglePressed, DescribeControl()</text>
<rect x="860" y="100" width="380" height="128" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<rect x="860" y="114" width="5" height="100" rx="2.5" fill="#38d6e8"/>
<text x="882" y="132" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start">Minimap and route hint</text>
<text x="882" y="158" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">idle timer runs and the full map draws only</text>
<text x="882" y="178" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">while Exploring; M is ignored while the UI</text>
<text x="882" y="198" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">owns the keyboard. Standalone: always in world.</text>
<line x1="422" y1="156.0" x2="520.75" y2="156.0" stroke="#5ee05a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrG)"/>
<line x1="759.25" y1="156.0" x2="858" y2="156.0" stroke="#5ee05a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrG)"/>
<rect x="522.75" y="139.0" width="234.5" height="34" rx="17" fill="#1d2750" stroke="#5ee05a" stroke-width="1.6"/>
<text x="640" y="160.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#eef2ff" text-anchor="middle">MinimapGameplay.Context = …</text>
<text x="640" y="196.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="middle">assign at startup; unset = standalone</text>
<rect x="40" y="250" width="380" height="128" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<rect x="40" y="264" width="5" height="100" rx="2.5" fill="#5ee05a"/>
<text x="62" y="282" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start">Your logger</text>
<text x="62" y="308" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="400" font-family="Cascadia Code, Consolas, Menlo, monospace">Sink(message, file, member)</tspan></text>
<text x="62" y="328" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">receives the caller file and member, so your</text>
<text x="62" y="348" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">log keeps the same signature as direct calls</text>
<rect x="860" y="250" width="380" height="128" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<rect x="860" y="264" width="5" height="100" rx="2.5" fill="#38d6e8"/>
<text x="882" y="282" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start">Runtime log</text>
<text x="882" y="308" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="400" font-family="Cascadia Code, Consolas, Menlo, monospace">LevelGenerationRuntimeLog.Info / Warn</tspan></text>
<text x="882" y="328" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">without a sink it writes to the Unity console:</text>
<text x="882" y="348" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="400" font-family="Cascadia Code, Consolas, Menlo, monospace">[LevelGeneration.&lt;File&gt;.&lt;Member&gt;] …</tspan></text>
<line x1="422" y1="306.0" x2="453.25" y2="306.0" stroke="#ff9548" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrO)"/>
<line x1="826.75" y1="306.0" x2="858" y2="306.0" stroke="#ff9548" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrO)"/>
<rect x="455.25" y="289.0" width="369.5" height="34" rx="17" fill="#1d2750" stroke="#ff9548" stroke-width="1.6"/>
<text x="640" y="310.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#eef2ff" text-anchor="middle">LevelGenerationRuntimeLog.InfoSink / WarnSink</text>
<text x="640" y="346.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="middle">unset = Unity console</text>
<rect x="40" y="400" width="380" height="128" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<rect x="40" y="414" width="5" height="100" rx="2.5" fill="#5ee05a"/>
<text x="62" y="432" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start">Editor content layout</text>
<text x="62" y="458" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">[InitializeOnLoad] in your editor assembly sets</text>
<text x="62" y="478" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">RoomPrefabRoots, RoomPrefabFolder,</text>
<text x="62" y="498" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">DefaultRoomPoolPath, RoomResourcesPath</text>
<rect x="860" y="400" width="380" height="128" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<rect x="860" y="414" width="5" height="100" rx="2.5" fill="#38d6e8"/>
<text x="882" y="432" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start">Authoring tools</text>
<text x="882" y="458" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">editor RoomDatabase scan, Room Authoring</text>
<text x="882" y="478" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">Toolkit, Room Compatibility Report. Players</text>
<text x="882" y="498" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="start">load rooms from TilesetSO.RoomPrefabs / Resources.</text>
<line x1="422" y1="456.0" x2="520.75" y2="456.0" stroke="#a07bff" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrP)"/>
<line x1="759.25" y1="456.0" x2="858" y2="456.0" stroke="#a07bff" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrP)"/>
<rect x="522.75" y="439.0" width="234.5" height="34" rx="17" fill="#1d2750" stroke="#a07bff" stroke-width="1.6"/>
<text x="640" y="460.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#eef2ff" text-anchor="middle">LevelGenerationProjectPaths</text>
<text x="640" y="496.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa6cf" text-anchor="middle">Editor only; default root: Assets</text>
<rect x="40" y="552" width="1200" height="64" rx="14" fill="#0f1530" stroke="#2c3868" stroke-width="1.5"/>
<text x="60" y="578" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">Fresh every Play Mode: </tspan><tspan fill="#9aa6cf" font-weight="400">the context and the log sinks reset on RuntimeInitializeLoadType.SubsystemRegistration (safe with domain reload off);</tspan></text>
<text x="60" y="600" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#9aa6cf" font-weight="400">assign them after that and before the first scene. </tspan><tspan fill="#eef2ff" font-weight="700">Guard: </tspan><tspan fill="#eef2ff" font-weight="400" font-family="Cascadia Code, Consolas, Menlo, monospace">LevelGenerationIndependenceTests</tspan><tspan fill="#9aa6cf" font-weight="400"> — package asmdefs reference only package, .NET and Unity assemblies.</tspan></text>
</svg>
